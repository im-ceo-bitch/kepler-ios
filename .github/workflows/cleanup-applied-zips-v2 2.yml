name: Clean ZIP archives v2

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'verified_only = proven matches; all_root_update_zips = ALL root iumrah-*.zip, including unapplied'
        required: true
        default: verified_only
        type: choice
        options:
          - verified_only
          - all_root_update_zips
      dry_run:
        description: 'Preview only; do not delete'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cleanup-applied-zips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Select archives and prepare backup
        id: plan
        shell: python
        env:
          CLEANUP_SCOPE: ${{ inputs.scope }}
        run: |
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import zipfile
          
          def git(*args, **kwargs):
              return subprocess.check_output(['git', '--literal-pathspecs', *args], **kwargs)
          
          root = Path.cwd()
          dry_run = True
          algorithm = git('rev-parse', '--show-object-format').decode().strip()
          if algorithm not in ('sha1', 'sha256'):
              raise RuntimeError('Unsupported Git object format')
          
          def blob_id(data):
              h = hashlib.new(algorithm)
              h.update(b'blob ' + str(len(data)).encode() + b'\0' + data)
              return h.hexdigest()
          
          def expected_files(archive):
              result = {}
              with zipfile.ZipFile(archive) as z:
                  members = z.infolist()
                  if len(members) > 5000 or sum(m.file_size for m in members) > 512 * 1024 * 1024:
                      raise ValueError('Archive exceeds verification limits')
                  for m in members:
                      name = m.filename
                      if '\\' in name or '\x00' in name:
                          raise ValueError('Non-canonical ZIP path')
                      p = PurePosixPath(name)
                      if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] == '.git':
                          raise ValueError('Unsafe ZIP path')
                      if m.is_dir():
                          continue
                      if stat.S_ISLNK(m.external_attr >> 16):
                          raise ValueError('ZIP symlink is not supported')
                      name = str(p)
                      if name in result or name == archive.name:
                          raise ValueError('Duplicate/self-referential ZIP entry')
                      if m.file_size > 64 * 1024 * 1024:
                          raise ValueError('Entry exceeds verification limit')
                      result[name] = blob_id(z.read(m))
              if not result:
                  raise ValueError('Empty archive')
              return result
          
          def matches(commit, expected):
              tree = {}
              for record in git('ls-tree', '-rz', '--full-tree', commit).split(b'\0'):
                  if not record:
                      continue
                  meta, raw_path = record.split(b'\t', 1)
                  mode, kind, oid = meta.split()
                  name = os.fsdecode(raw_path)
                  if name in expected and kind == b'blob' and mode in (b'100644', b'100755'):
                      tree[name] = oid.decode()
              return all(tree.get(name) == digest for name, digest in expected.items())
          
          
          import json
          import shutil
          import tempfile
          
          scope = os.environ['CLEANUP_SCOPE']
          tracked = [os.fsdecode(p) for p in git('ls-files', '-z').split(b'\0') if p]
          archives = sorted(p for p in tracked if '/' not in p and p.startswith('iumrah-') and p.endswith('.zip') and (root / p).is_file() and not (root / p).is_symlink())
          selected = []
          head = git('rev-parse', 'HEAD').decode().strip()
          if scope == 'all_root_update_zips':
              # Explicit user-selected scope: no claim these ZIPs were successfully applied.
              selected = archives
          elif scope == 'verified_only':
              for name in archives:
                  try:
                      expected = expected_files(root / name)
                      commits = [head] + git('log', '--format=%H', '--max-count=1000', 'HEAD', '--', *expected).decode().splitlines()
                      evidence = next((c for c in dict.fromkeys(commits) if matches(c, expected)), None)
                      if evidence:
                          selected.append(name)
                          print(f'VERIFIED {name!r}: {evidence}')
                      else:
                          print(f'KEPT {name!r}: no complete historical match')
                  except (ValueError, OSError, zipfile.BadZipFile, RuntimeError, subprocess.CalledProcessError) as exc:
                      print(f'KEPT {name!r}: {exc}')
          else:
              raise RuntimeError('Unknown cleanup scope')
          
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'## ZIP cleanup plan\n\nScope: `{scope}`. Found: {len(archives)}. Selected: {len(selected)}.\n\n')
              for name in selected:
                  out.write('- ' + name.replace('`', '') + '\n')
          if archives and not selected:
              raise RuntimeError('ZIP files exist, but none could be verified. Nothing deleted. See the log; all_root_update_zips is a separate explicit removal scope.')
          
          backup = Path(tempfile.mkdtemp(prefix='iumrah-zip-backup-', dir=os.environ['RUNNER_TEMP']))
          manifest = {}
          for name in selected:
              shutil.copyfile(root / name, backup / name)
              manifest[name] = hashlib.sha256((backup / name).read_bytes()).hexdigest()
          (backup / 'cleanup-manifest.json').write_text(json.dumps(manifest, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'count={len(selected)}\nbackup={backup}\n')

      - name: Upload backup before deletion
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: zip-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.backup }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Delete only backed-up files
        if: ${{ !inputs.dry_run && steps.plan.outputs.count != '0' }}
        shell: python
        env:
          BACKUP_DIR: ${{ steps.plan.outputs.backup }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          backup = Path(os.environ['BACKUP_DIR'])
          manifest = json.loads((backup / 'cleanup-manifest.json').read_text())
          for name, expected in manifest.items():
              path = Path(name)
              if path.name != name or not name.startswith('iumrah-') or not name.endswith('.zip') or path.is_symlink():
                  raise RuntimeError('Unsafe cleanup candidate')
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise RuntimeError('ZIP changed after backup: ' + name)
          for name in manifest:
              subprocess.run(['git', '--literal-pathspecs', 'rm', '--', name], check=True)
          print(f'Removed {len(manifest)} backed-up ZIP files from the working tree.')

      - name: Commit, push and verify remote deletion
        if: ${{ !inputs.dry_run && steps.plan.outputs.count != '0' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          BACKUP_DIR: ${{ steps.plan.outputs.backup }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove backed-up update ZIP archives [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
          git fetch origin "$TARGET_BRANCH"
          python3 - <<'PYVERIFY'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads((Path(os.environ['BACKUP_DIR']) / 'cleanup-manifest.json').read_text())
          tracked = set(subprocess.check_output(['git', 'ls-tree', '-rz', '--name-only', 'FETCH_HEAD']).decode().split('\0'))
          remaining = set(manifest) & tracked
          if remaining:
              raise RuntimeError('ZIP files still on remote branch: ' + repr(remaining))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'\n**Confirmed removed from remote branch: {len(manifest)} ZIP files.**\n')
          PYVERIFY

      - name: Report preview or already clean repository
        if: ${{ inputs.dry_run || steps.plan.outputs.count == '0' }}
        env:
          IS_PREVIEW: ${{ inputs.dry_run }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            echo '**Preview only: deletion was not requested.**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**No root iumrah-*.zip files found: repository is already clean for this scope.**' >> "$GITHUB_STEP_SUMMARY"
          fi
