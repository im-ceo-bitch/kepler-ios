name: Iumrah | TestFlight | Intel | New Team

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'App Store version, e.g. 2.1.0 (must not be lower than repo)'
        type: string
        required: true
        default: '2.1.0'

permissions:
  contents: read

concurrency:
  group: iumrah-newteam-testflight
  cancel-in-progress: false

jobs:
  build_gate:
    runs-on: macos-26-intel
    timeout-minutes: 55
    env:
      APPLE_TEAM_ID: HVT4U96286
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode 26 / Intel
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64" || { echo "Intel runner required"; exit 1; }
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - name: Validate Apple-transfer configuration
        run: python3 scripts/ci_apple_transfer_check.py
      - name: Repository preflight (Swift parsing + assets + locales)
        run: python3 scripts/ci_preflight.py
      - name: Prepare iPhone/iPad icons
        run: python3 scripts/prepare_iumrah_icons_ci.py
      - name: Install XcodeGen
        run: |
          brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          
          path = Path('project.yml')
          content = path.read_text()
          for target, profile in [('iUmra', 'IUMRAH_PROFILE_NAME'), ('iUmraWidgets', 'IUMRAH_WIDGET_PROFILE_NAME')]:
              pattern = re.compile(r'(?ms)^(  ' + re.escape(target) + r':\n)(.*?)(?=^  [A-Za-z][A-Za-z0-9_-]*:\s*$|\Z)')
              match = pattern.search(content)
              if not match:
                  raise SystemExit(f'Missing XcodeGen target: {target}')
              block = match.group(2)
              header = '    settings:\n      base:\n'
              if header not in block:
                  raise SystemExit(f'Missing target-scoped base settings: {target}')
              if target == 'iUmraWidgets':
                  block, count = re.subn(r'(?m)^(        PRODUCT_BUNDLE_IDENTIFIER:\s*)com\.iumrah\.app\.widgets(?=\s*$)',
                                         r'\g<1>com.iumrah.app.widgetkit', block)
                  if count != 1 and 'PRODUCT_BUNDLE_IDENTIFIER: com.iumrah.app.widgetkit' not in block:
                      raise SystemExit('Cannot locate widget bundle identifier in project.yml')
              for setting in ('CODE_SIGN_STYLE', 'CODE_SIGN_IDENTITY', 'DEVELOPMENT_TEAM', 'PROVISIONING_PROFILE_SPECIFIER'):
                  block = re.sub(r'(?m)^        ' + setting + r':[^\n]*\n', '', block)
              settings = ('        CODE_SIGN_STYLE: Manual\n'
                          '        CODE_SIGN_IDENTITY: "Apple Distribution"\n'
                          '        DEVELOPMENT_TEAM: "$(IUMRAH_APPLE_TEAM_ID)"\n'
                          f'        PROVISIONING_PROFILE_SPECIFIER: "$({profile})"\n')
              block = block.replace(header, header + settings, 1)
              content = content[:match.start()] + match.group(1) + block + content[match.end():]
          path.write_text(content)
          print('Configured Release signing for iUmra / iUmraWidgets and widget ID com.iumrah.app.widgetkit')
          PYCODE
          xcodegen generate
      - name: Install Metal Toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
      - name: Build-only gate (NO Apple secrets and NO signing)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild -project iUmra.xcodeproj -scheme iUmra -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iumrah-gate-derived" \
            IUMRAH_APPLE_TEAM_ID=HVT4U96286 CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/iumrah-build-gate.log"
      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-build-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/iumrah-build-gate.log
          if-no-files-found: ignore
          retention-days: 7

  testflight_upload:
    needs: build_gate
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      MARKETING_VERSION: ${{ inputs.release_version || '2.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require NEW Apple Team and new API credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${APPLE_TEAM_ID:-}" = 'HVT4U96286' || { echo 'STOP: APPLE_TEAM_ID not new team HVT4U96286'; exit 1; }
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            test -n "${!name:-}" || { echo "Missing GitHub secret $name"; exit 1; }
          done
          if [ ! "$(uname -m)" = x86_64 ]; then echo 'Wrong runner'; exit 1; fi
          xcodebuild -version | grep -E '^Xcode 26\.'
          python3 scripts/ci_apple_transfer_check.py
          python3 - <<'PYCODE'
          import os,re
          v=os.environ['MARKETING_VERSION'].strip(); repo='2.1.0'
          def vparts(s):
              if not re.fullmatch(r'\d+\.\d+\.\d+',s): raise ValueError('Invalid version')
              return tuple(map(int,s.split('.')))
          if vparts(v)<vparts(repo): raise SystemExit(f'Release version {v} is less than minimum {repo}. Set release_version to {repo} or higher in Run workflow.')
          print('Release marketing version:',v)
          PYCODE
      - name: Install Distribution certificate and provisioning profiles
        shell: bash
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for secret in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_APP_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64 IOS_KEYCHAIN_PASSWORD; do
            test -n "${!secret:-}" || { echo "Missing GitHub secret: $secret"; exit 1; }
          done
          CERT_PATH="$RUNNER_TEMP/iumrah-distribution.p12"
          APP_PROFILE="$RUNNER_TEMP/iumrah-app.mobileprovision"
          WIDGET_PROFILE="$RUNNER_TEMP/iumrah-widget.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/iumrah-ci.keychain-db"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$IOS_APP_PROFILE_BASE64" | base64 -D > "$APP_PROFILE"
          printf '%s' "$IOS_WIDGET_PROFILE_BASE64" | base64 -D > "$WIDGET_PROFILE"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Apple Distribution:'
          python3 - <<'PYCODE'
          import os, plistlib, pathlib, subprocess, hashlib, shutil
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          p12 = temp / 'iumrah-distribution.p12'
          p = subprocess.run(['openssl','pkcs12','-clcerts','-nokeys','-in',str(p12),'-passin','env:IOS_DIST_P12_PASSWORD'], capture_output=True, check=True)
          cert = subprocess.run(['openssl','x509','-outform','DER'], input=p.stdout, capture_output=True, check=True).stdout
          digest = hashlib.sha256(cert).digest()
          dest = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          dest.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for filename, bundle, envname in [
                  ('iumrah-app.mobileprovision','com.iumrah.app','IUMRAH_PROFILE_NAME'),
                  ('iumrah-widget.mobileprovision','com.iumrah.app.widgetkit','IUMRAH_WIDGET_PROFILE_NAME')]:
                  source = temp / filename
                  data = subprocess.check_output(['security','cms','-D','-i',str(source)])
                  profile = plistlib.loads(data)
                  ident = profile['Entitlements']['application-identifier']
                  expected = os.environ['APPLE_TEAM_ID'] + '.' + bundle
                  if ident != expected or os.environ['APPLE_TEAM_ID'] not in profile['TeamIdentifier']:
                      raise SystemExit(f'Incorrect App ID or Apple Team in {filename}: {ident}')
                  if not any(hashlib.sha256(c).digest() == digest for c in profile['DeveloperCertificates']):
                      raise SystemExit(f'Certificate does not match {filename}')
                  shutil.copyfile(source, dest / (profile['UUID'] + '.mobileprovision'))
                  env.write(f"{envname}={profile['Name']}\n")
                  print('Installed matching distribution profile for', bundle)
          PYCODE
          echo "IUMRAH_CI_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Install .p8 API key on runner (ephemeral)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/appstore-api"
          KEYFILE="$RUNNER_TEMP/appstore-api/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          openssl pkey -in "$KEYFILE" -noout >/dev/null || { echo 'Invalid ASC_API_KEY_P8 PEM contents'; exit 1; }
          echo "ASC_P8_PATH=$KEYFILE" >> "$GITHUB_ENV"
          unset ASC_API_KEY_P8
      - name: Determine build number by NEW App Store Connect App ID
        shell: bash
        run: ruby scripts/ci_next_testflight_build.rb
      - name: Prepare app icons and XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_iumrah_icons_ci.py
          brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          
          path = Path('project.yml')
          content = path.read_text()
          for target, profile in [('iUmra', 'IUMRAH_PROFILE_NAME'), ('iUmraWidgets', 'IUMRAH_WIDGET_PROFILE_NAME')]:
              pattern = re.compile(r'(?ms)^(  ' + re.escape(target) + r':\n)(.*?)(?=^  [A-Za-z][A-Za-z0-9_-]*:\s*$|\Z)')
              match = pattern.search(content)
              if not match:
                  raise SystemExit(f'Missing XcodeGen target: {target}')
              block = match.group(2)
              header = '    settings:\n      base:\n'
              if header not in block:
                  raise SystemExit(f'Missing target-scoped base settings: {target}')
              if target == 'iUmraWidgets':
                  block, count = re.subn(r'(?m)^(        PRODUCT_BUNDLE_IDENTIFIER:\s*)com\.iumrah\.app\.widgets(?=\s*$)',
                                         r'\g<1>com.iumrah.app.widgetkit', block)
                  if count != 1 and 'PRODUCT_BUNDLE_IDENTIFIER: com.iumrah.app.widgetkit' not in block:
                      raise SystemExit('Cannot locate widget bundle identifier in project.yml')
              for setting in ('CODE_SIGN_STYLE', 'CODE_SIGN_IDENTITY', 'DEVELOPMENT_TEAM', 'PROVISIONING_PROFILE_SPECIFIER'):
                  block = re.sub(r'(?m)^        ' + setting + r':[^\n]*\n', '', block)
              settings = ('        CODE_SIGN_STYLE: Manual\n'
                          '        CODE_SIGN_IDENTITY: "Apple Distribution"\n'
                          '        DEVELOPMENT_TEAM: "$(IUMRAH_APPLE_TEAM_ID)"\n'
                          f'        PROVISIONING_PROFILE_SPECIFIER: "$({profile})"\n')
              block = block.replace(header, header + settings, 1)
              content = content[:match.start()] + match.group(1) + block + content[match.end():]
          path.write_text(content)
          print('Configured Release signing for iUmra / iUmraWidgets and widget ID com.iumrah.app.widgetkit')
          PYCODE
          xcodegen generate
      - name: Install Metal Toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
      - name: Archive using Apple authenticated automatic signing
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          # Use the installed Apple Distribution identity and the two manual profiles.
          xcodebuild -project iUmra.xcodeproj -scheme iUmra -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Iumrah.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            IUMRAH_APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            IUMRAH_PROFILE_NAME="$IUMRAH_PROFILE_NAME" IUMRAH_WIDGET_PROFILE_NAME="$IUMRAH_WIDGET_PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee "$RUNNER_TEMP/iumrah-archive.log"
      - name: Validate signed archive app and Widget ID
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Iumrah.xcarchive/Products/Applications/iUmra.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.iumrah.app'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$MARKETING_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx "$BUILD_NUMBER"
          codesign --verify --strict "$APP"
          codesign -dvv "$APP" 2> "$RUNNER_TEMP/app-codesign.txt"
          grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/app-codesign.txt"
          WIDGET="$APP/PlugIns/iUmraWidgets.appex"
          test -d "$WIDGET"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET/Info.plist" | grep -Fx 'com.iumrah.app.widgetkit'
          codesign --verify --strict "$WIDGET"
          codesign -dvv "$WIDGET" 2> "$RUNNER_TEMP/widget-codesign.txt"
          grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/widget-codesign.txt"
          codesign -d --entitlements :- "$APP" 2> /dev/null > "$RUNNER_TEMP/iumrah-signed-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$RUNNER_TEMP/iumrah-signed-entitlements.plist" | grep -Fx "$APPLE_TEAM_ID.com.iumrah.shared"
      - name: Export IPA using new Apple Team
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
             <key>method</key><string>app-store-connect</string>
             <key>signingStyle</key><string>manual</string>
             <key>signingCertificate</key><string>Apple Distribution</string>
             <key>teamID</key><string>${APPLE_TEAM_ID}</string>
             <key>provisioningProfiles</key><dict>
               <key>com.iumrah.app</key><string>${IUMRAH_PROFILE_NAME}</string>
               <key>com.iumrah.app.widgetkit</key><string>${IUMRAH_WIDGET_PROFILE_NAME}</string>
             </dict>
             <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Iumrah.xcarchive" \
            -exportPath "$RUNNER_TEMP/iumrah-ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/iumrah-export.log"
          IPA=$(find "$RUNNER_TEMP/iumrah-ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA" || { echo 'No IPA produced'; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
      - name: Upload to TestFlight (App Store Connect API, no app password)
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}
      - name: Summary
        if: success()
        shell: bash
        run: |
          echo "### Uploaded iumrah $MARKETING_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple Team: HVT4U96286 / App: 6759577859 / com.iumrah.app" >> "$GITHUB_STEP_SUMMARY"
          echo "Check App Store Connect → TestFlight after Apple's processing." >> "$GITHUB_STEP_SUMMARY"
      - name: Save diagnostics (not signing materials)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-upload-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/iumrah-archive.log
            ${{ runner.temp }}/iumrah-export.log
          if-no-files-found: ignore
          retention-days: 7
